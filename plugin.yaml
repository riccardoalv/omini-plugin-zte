id: zte
name: ZTE ONT
version: 0.1.0
protocol: 1
entrypoint: main.py
timeout_s: 120
description: >-
  ZTE fiber ONTs (GPON) through their web interface (tested on the F670L, firmware
  V9): the PON link with the optical module's receive and transmit power,
  temperature, voltage and bias; the WAN connections (PPPoE, IPv4 and IPv6) and
  their gateways; the LAN ports with link speed, traffic and errors; ARP, the
  MAC table, DHCP and DHCPv6 leases, the Wi-Fi networks, radios and clients, port
  forwards, UPnP mappings and the DMZ host; CPU, memory, uptime and firmware.
  It sets fixed addresses, local DNS names, the Wi-Fi networks (name, password,
  on or off) and a radio's channel, pauses devices (the MAC filter) and backs up
  its settings without secrets. The ONT allows one session at a time: the plugin
  signs out after every run.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-zte
changes:
  - reservation.set
  - reservation.delete
  - dns.set
  - dns.delete
  - wifi.set
  - wifi.delete
  - wifi.channel
  - pause.set
  - pause.delete
backup: true
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: The ONT's web interface, e.g. http://192.168.1.1 (on many operators' ONTs, http://192.168.100.1).
  - key: username
    type: string
    label: Username
    required: true
    default: admin
    help: >-
      The administrator account of the web interface (admin), often printed on
      the ONT's label or given by the operator. The "user" account usually
      sees fewer pages.
  - key: password
    type: secret
    label: Password
    required: true
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    group: Advanced
    help: Only for an https:// address; the ONT uses a self-signed certificate.
  - key: timeout_s
    type: int
    label: Timeout (seconds)
    default: 15
    group: Advanced
    help: How long to wait for each answer of the ONT.
